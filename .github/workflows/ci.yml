name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Ejecutar ShellCheck
        run: |
          shellcheck -x scripts/omarchy-onboarding/onboard-machine.sh
          shellcheck scripts/omarchy-onboarding/ci-idempotencia.sh
          shellcheck -x scripts/omarchy-onboarding/bashrc-overlay.sh
          shellcheck -x -P SCRIPTDIR:. tests/onboarding/test-bashrc-overlay.sh

  vault:
    name: Validación del Vault
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar integridad del Vault
        run: python3 scripts/validate_vault.py

  onboarding-idempotencia:
    name: Idempotencia de Onboarding
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Instalar dependencias en contenedor
        run: pacman -Sy --noconfirm git acl sudo gnupg diffutils
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Ejecutar validación de idempotencia
        run: bash scripts/omarchy-onboarding/ci-idempotencia.sh

  secretos:
    name: Tests de secretos (age)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Instalar dependencias en contenedor
        run: pacman -Sy --noconfirm age python tar gzip diffutils
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Test de secretos (modo batchpass si el paquete lo trae)
        run: |
          age --version
          command -v age-plugin-batchpass || echo "sin age-plugin-batchpass: se usa el respaldo pty"
          bash tests/secrets/test-export-staging-dotfiles.sh
      - name: Test de secretos (respaldo pty, sin plugin)
        run: LF_SIN_BATCHPASS=1 bash tests/secrets/test-export-staging-dotfiles.sh

  bashrc-overlay:
    name: Test de ~/.bashrc (overlay ravn-omarchy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Ejecutar test con fixtures
        run: bash tests/onboarding/test-bashrc-overlay.sh
