# Plantilla sanitizada de referencia para rclone multi-usuario (/etc/rclone/rclone.conf)
# Los tokens reales se gestionan mediante el paquete cifrado 'scripts/secrets/secrets.tar.gz.age'
# y se desbloquean con 'scripts/secrets/desbloquear-secretos.sh'.

[gdrive]
type = drive
scope = drive
client_id = TU_CLIENT_ID.apps.googleusercontent.com
client_secret = TU_CLIENT_SECRET
token = {"access_token":"...","token_type":"Bearer","refresh_token":"...","expiry":"..."}
team_drive = 

[gdrive_boveda]
type = crypt
remote = gdrive:gracie/_boveda_cifrada
filename_encryption = standard
directory_name_encryption = true
password = TU_CLAVE_DE_BOVEDA_OBSCURECIDA
