# Hyprland minimal guest sandbox configuration
monitor=,preferred,auto,1

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4, easeOutQuint
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

input {
    kb_layout = us,latam
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

# Auto-start Brave Origin
exec-once = /usr/bin/brave-origin

# Keybindings
$mainMod = SUPER

bind = $mainMod, Space, exec, fuzzel
bind = $mainMod, B, exec, /usr/bin/brave-origin
bind = $mainMod, Return, exec, ghostty || alacritty || foot || xterm
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
