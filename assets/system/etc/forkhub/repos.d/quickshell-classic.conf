name="quickshell-classic"
description="Clavis Shell Classic (Quickshell personal-classic)"
repo_dir="/opt/src/quickshell-classic"
remote="origin"
branch="personal-classic"
group="clavis"
auto_update=true
fork_repo="robert-flo/quickshell"
upstream_repo="StatIndet/quickshell"
upstream_branch="main"
sync_strategy="adr0024"
post_update="cmake --build /opt/src/quickshell-classic/build -j\$(nproc) && cmake --install /opt/src/quickshell-classic/build"
