name="quickshell-classic"
description="Clavis Shell Classic (Quickshell personal-classic - Congelado / Cherry-pick manual)"
repo_dir="/opt/src/quickshell-classic"
remote="origin"
branch="personal-classic"
group="clavis"
auto_update=false
