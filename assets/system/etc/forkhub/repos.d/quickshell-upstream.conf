name="quickshell-upstream"
description="Clavis Shell Upstream Puro (StatIndet/quickshell main puro)"
repo_dir="/opt/src/quickshell-upstream"
remote="upstream"
branch="main"
group="clavis"
auto_update=true
upstream_repo="StatIndet/quickshell"
upstream_branch="main"
sync_strategy="upstream-pure"
post_update="cmake --build /opt/src/quickshell-upstream/build -j\$(nproc) && cmake --install /opt/src/quickshell-upstream/build"
